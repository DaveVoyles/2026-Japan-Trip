<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Trip Bookings Status</title>
    <script src="assets/scripts/theme.js?v=20260507a"></script>
    <link rel="stylesheet" href="assets/styles/theme.css?v=20260507a" />
    <link rel="stylesheet" href="assets/styles/site-nav.css?v=20260507d" />
    <script defer src="assets/scripts/site-nav.js?v=20260507d"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--cp-text);
        background:
          radial-gradient(
            circle at 12% 10%,
            var(--cp-accent-soft) 0,
            transparent 38%
          ),
          radial-gradient(
            circle at 90% 15%,
            var(--cp-highlight) 0,
            transparent 28%
          ),
          var(--cp-bg);
      }

      .wrap {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.8rem;
      }

      .subtitle {
        color: var(--cp-text-muted);
        margin: 0 0 20px;
      }

      .section {
        margin-bottom: 28px;
      }

      .section.is-hidden {
        display: none;
      }

      .section-title {
        font-size: 1.2rem;
        margin: 0 0 12px;
        color: var(--cp-text);
        border-bottom: 2px solid var(--cp-border);
        padding-bottom: 8px;
      }

      .booking-card {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 10px;
        box-shadow: var(--cp-shadow);
      }

      .booking-card.is-hidden {
        display: none;
      }

      .booking-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 10px;
      }

      .booking-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 500;
      }

      .status-badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status-confirmed {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-success);
        color: var(--cp-success);
      }

      .status-pending {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-warning);
        color: var(--cp-warning);
      }

      .status-critical {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-danger);
        color: var(--cp-danger);
      }

      .status-considering {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-highlight);
        color: var(--cp-text);
      }

      .status-walk-up {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-link);
        color: var(--cp-link);
      }

      .status-sold-out {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-danger);
        color: var(--cp-danger);
      }

      .status-closed {
        background: var(--cp-surface-soft);
        border: 1px solid var(--cp-border-strong);
        color: var(--cp-text-muted);
      }

      .booking-details {
        display: grid;
        gap: 8px;
        font-size: 0.9rem;
      }

      .detail-row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
      }

      .detail-label {
        color: var(--cp-text-muted);
        font-weight: 500;
      }

      .detail-value {
        color: var(--cp-text);
      }

      .conf-number {
        font-family: monospace;
        background: var(--cp-bg);
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.85rem;
      }

      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 20px;
      }

      .summary-card {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 16px;
        display: grid;
        grid-template-rows: 1fr auto;
        align-items: center;
        justify-content: center;
        justify-items: center;
        min-height: 96px;
        text-align: center;
      }

      .summary-number {
        font-size: 1.6rem;
        font-weight: 600;
        color: var(--cp-accent);
        line-height: 1;
      }

      .summary-label {
        font-size: 0.85rem;
        color: var(--cp-text-muted);
        margin-top: 0;
        font-weight: 600;
        line-height: 1.2;
        min-height: 1.2em;
        white-space: nowrap;
      }

      .summary-card[data-status="pending"],
      .summary-card[data-status="sold-out"] {
        border-color: var(--cp-warning);
      }

      .summary-card[data-status="critical"] {
        border-color: var(--cp-danger);
      }

      .summary-card[data-status="confirmed"] {
        border-color: var(--cp-success);
      }

      .action-strip {
        display: grid;
        gap: 10px;
        margin-bottom: 20px;
      }

      .action-card {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-left: 4px solid var(--cp-warning);
        border-radius: 10px;
        padding: 12px;
      }

      .action-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .action-card p {
        margin: 0;
        color: var(--cp-text-muted);
        line-height: 1.45;
      }

      .filter-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }

      .filter-button {
        border: 1px solid var(--cp-border);
        background: var(--cp-surface);
        color: var(--cp-text);
        border-radius: 999px;
        padding: 7px 12px;
        font-family: inherit;
        font-size: 0.86rem;
        cursor: pointer;
      }

      .filter-button[aria-pressed="true"] {
        background: var(--cp-accent);
        border-color: var(--cp-accent);
        color: var(--cp-accent-fg);
      }

      .empty-state {
        display: none;
        margin: 20px 0;
        padding: 14px;
        border: 1px dashed var(--cp-border-strong);
        border-radius: 10px;
        color: var(--cp-text-muted);
        text-align: center;
      }

      .empty-state.is-visible {
        display: block;
      }

      .deadline-alert {
        background: var(--cp-surface-soft);
        border-left: 4px solid var(--cp-danger);
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 16px;
      }

      .deadline-alert p {
        margin: 0;
        color: var(--cp-danger);
        font-weight: 500;
      }

      @media (max-width: 700px) {
        .wrap {
          padding: 12px;
        }

        h1 {
          font-size: 1.4rem;
        }

        .detail-row {
          grid-template-columns: 1fr;
        }

        .detail-label::after {
          content: ":";
        }
      }

      @media print {
        body {
          background: var(--cp-surface);
          padding: 0;
        }

        .booking-card {
          page-break-inside: avoid;
          box-shadow: none;
          border: 1px solid var(--cp-border);
        }
      }
    </style>
  </head>
  <body data-nav-root=".">
    <div class="wrap">
      <h1>📌 Japan Trip 2026 — Bookings Status</h1>
      <p class="subtitle">
        Complete reservation checklist: hotels, flights, trains, dining, and
        attractions.
      </p>

      <div class="summary" id="summaryCards" aria-label="Booking status summary"></div>
      <div class="action-strip" id="nextActions" aria-label="Booking next actions"></div>
      <div class="filter-bar" id="bookingFilters" aria-label="Booking filters"></div>
      <div class="empty-state" id="emptyState">
        No bookings match this filter.
      </div>

      <div id="sections"></div>
    </div>

    <script>
      const categoryLabels = {
        hotels: "🏨 Hotels",
        flights: "✈️ Flights",
        trains: "🚄 Trains",
        dining: "🍽️ Dining",
        attractions: "🎟️ Attractions",
      };

      const sections = document.getElementById("sections");
      const summaryCards = document.getElementById("summaryCards");
      const bookingFilters = document.getElementById("bookingFilters");
      const nextActions = document.getElementById("nextActions");
      const emptyState = document.getElementById("emptyState");

      const statusLabels = {
        confirmed: "Confirmed",
        pending: "Pending",
        critical: "Critical",
        considering: "Considering",
        "walk-up": "Walk-Up",
        "sold-out": "Sold Out",
        closed: "Closed",
      };

      const summaryStatusOrder = [
        { status: "confirmed", icon: "✅" },
        { status: "considering", icon: "🤔" },
        { status: "pending", icon: "🟡" },
        { status: "critical", icon: "🔴" },
        { status: "sold-out", icon: "⛔" },
        { status: "closed", icon: "🚫" },
        { status: "walk-up", icon: "🚶" },
      ];

      const filterDefs = [
        { id: "all", label: "All" },
        { id: "needs-action", label: "Needs action" },
        { id: "considering", label: "Considering" },
        { id: "pending", label: "Pending" },
        { id: "confirmed", label: "Confirmed" },
        { id: "no-booking", label: "No booking needed" },
      ];

      const isFutureOptional = (booking) =>
        booking.status === "considering" &&
        /future optional/i.test(booking.dates || "");
      const needsAction = (booking) =>
        booking.status === "pending" ||
        booking.status === "critical" ||
        (booking.status === "considering" && !isFutureOptional(booking));
      const noBookingNeeded = (booking) =>
        ["walk-up", "sold-out", "closed"].includes(booking.status);

      function renderSummary(allItems) {
        summaryStatusOrder.forEach(({ status, icon }) => {
          const card = document.createElement("div");
          card.className = "summary-card";
          card.dataset.status = status;

          const number = document.createElement("div");
          number.className = "summary-number";
          number.textContent = allItems.filter((b) => b.status === status).length;

          const label = document.createElement("div");
          label.className = "summary-label";
          label.textContent = `${icon} ${statusLabels[status]}`;

          card.appendChild(number);
          card.appendChild(label);
          summaryCards.appendChild(card);
        });
      }

      function renderNextActions(allItems) {
        const actionItems = allItems
          .filter((booking) => needsAction(booking))
          .slice(0, 4);

        if (!actionItems.length) {
          const card = document.createElement("div");
          card.className = "action-card";
          card.style.borderLeftColor = "var(--cp-success)";
          const title = document.createElement("strong");
          const detail = document.createElement("p");
          title.textContent = "No critical booking actions";
          detail.textContent =
            "Pending work is clear for now. Future optional ideas stay visible under Considering, but do not block the active plan.";
          card.appendChild(title);
          card.appendChild(detail);
          nextActions.appendChild(card);
          return;
        }

        actionItems.forEach((booking) => {
          const card = document.createElement("div");
          card.className = "action-card";
          const deadline =
            booking.details["Booking Deadline"] ||
            booking.details["Booking Window"] ||
            booking.details.Action ||
            "Review details";
          const title = document.createElement("strong");
          const detail = document.createElement("p");
          title.textContent = booking.name;
          detail.textContent = deadline;
          card.appendChild(title);
          card.appendChild(detail);
          nextActions.appendChild(card);
        });
      }

      function renderFilters(allItems) {
        filterDefs.forEach((filter, index) => {
          const button = document.createElement("button");
          button.className = "filter-button";
          button.type = "button";
          button.dataset.filter = filter.id;
          button.setAttribute("aria-pressed", index === 0 ? "true" : "false");
          button.textContent = filter.label;
          button.addEventListener("click", () => applyFilter(filter.id));
          bookingFilters.appendChild(button);
        });
      }

      function shouldShowBooking(booking, filter) {
        if (filter === "all") return true;
        if (filter === "needs-action") return needsAction(booking);
        if (filter === "no-booking") return noBookingNeeded(booking);
        return booking.status === filter;
      }

      function applyFilter(filter) {
        let visibleCount = 0;
        document.querySelectorAll(".filter-button").forEach((button) => {
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.filter === filter),
          );
        });

        document.querySelectorAll(".booking-card").forEach((card) => {
          const show = shouldShowBooking(
            { status: card.dataset.status, dates: card.dataset.dates },
            filter,
          );
          card.classList.toggle("is-hidden", !show);
          if (show) visibleCount += 1;
        });

        document.querySelectorAll(".section").forEach((section) => {
          const hasVisibleCard = Array.from(
            section.querySelectorAll(".booking-card"),
          ).some((card) => !card.classList.contains("is-hidden"));
          section.classList.toggle("is-hidden", !hasVisibleCard);
        });

        emptyState.classList.toggle("is-visible", visibleCount === 0);
      }

      function renderSections(bookings) {
        Object.entries(bookings).forEach(([category, items]) => {
          const sectionDiv = document.createElement("div");
          sectionDiv.className = "section";

          const title = document.createElement("h2");
          title.className = "section-title";
          title.textContent =
            categoryLabels[category] ||
            category.charAt(0).toUpperCase() + category.slice(1);
          sectionDiv.appendChild(title);

          items.forEach((booking) => {
            const card = document.createElement("div");
            card.className = "booking-card";
            card.dataset.status = booking.status;
            card.dataset.dates = booking.dates;

            const header = document.createElement("div");
            header.className = "booking-header";

            const bookingTitle = document.createElement("h3");
            bookingTitle.className = "booking-title";
            bookingTitle.textContent = booking.name;

            const badge = document.createElement("span");
            badge.className = `status-badge status-${booking.status}`;
            badge.textContent = statusLabels[booking.status] || booking.status;

            header.appendChild(bookingTitle);
            header.appendChild(badge);
            card.appendChild(header);

            const datesDiv = document.createElement("p");
            datesDiv.style.margin = "0 0 10px";
            datesDiv.style.color = "var(--cp-text-muted)";
            datesDiv.style.fontSize = "0.9rem";
            datesDiv.textContent = booking.dates;
            card.appendChild(datesDiv);

            const details = document.createElement("div");
            details.className = "booking-details";

            Object.entries(booking.details).forEach(([label, value]) => {
              const row = document.createElement("div");
              row.className = "detail-row";

              const labelDiv = document.createElement("div");
              labelDiv.className = "detail-label";
              labelDiv.textContent = label;

              const valueDiv = document.createElement("div");
              valueDiv.className = "detail-value";
              if (label === "Conf #" || label === "Res #" || label === "Booking ID" || label === "Confirmation #") {
                const code = document.createElement("code");
                code.className = "conf-number";
                code.textContent = value;
                valueDiv.appendChild(code);
              } else {
                valueDiv.textContent = value;
              }

              row.appendChild(labelDiv);
              row.appendChild(valueDiv);
              details.appendChild(row);
            });

            card.appendChild(details);
            sectionDiv.appendChild(card);
          });

          sections.appendChild(sectionDiv);
        });
      }

      async function init() {
        try {
          const response = await fetch("./data/bookings.json");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const bookings = await response.json();
          const allItems = Object.entries(bookings).flatMap(([category, items]) =>
            items.map((item) => ({ ...item, category })),
          );
          renderSummary(allItems);
          renderNextActions(allItems);
          renderFilters(allItems);
          renderSections(bookings);
        } catch (err) {
          sections.innerHTML = `<p style="color:var(--cp-error,#c00);padding:1rem;">⚠️ Could not load booking data. ${err.message}</p>`;
          console.error("Bookings data load failed:", err);
        }
      }

      init();
    </script>
  </body>
</html>
