<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Trip Route Viewer</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }
    </style>
    <script src="../assets/scripts/theme.js?v=20260507a"></script>
    <link rel="stylesheet" href="../assets/styles/theme.css?v=20260507a" />
    <link rel="stylesheet" href="../assets/styles/site-nav.css?v=20260507d" />
    <script defer src="../assets/scripts/site-nav.js?v=20260507d"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--cp-text);
        background: var(--cp-bg);
      }

      a {
        color: var(--cp-link);
        text-decoration: none;
      }

      a:hover {
        color: var(--cp-accent-hover);
        text-decoration: underline;
      }

      .wrap {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 20px;
      }

      .hero,
      .panel,
      .segment,
      .stop-card,
      .empty-state {
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        box-shadow: var(--cp-shadow);
      }

      .hero {
        padding: clamp(18px, 4vw, 32px);
        margin-bottom: 16px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--cp-text-muted);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: clamp(2rem, 4vw, 3.35rem);
        line-height: 1.05;
      }

      .summary {
        max-width: 820px;
        margin-bottom: 0;
        color: var(--cp-text-muted);
        font-size: 1.06rem;
        line-height: 1.6;
      }

      .badge-row,
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .badge-row {
        margin-bottom: 14px;
      }

      .route-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--cp-border-strong);
        border-radius: 999px;
        padding: 5px 11px;
        background: var(--cp-surface-soft);
        color: var(--cp-text);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .route-badge::before {
        content: "";
        width: 0.7em;
        height: 0.7em;
        margin-right: 0.45em;
        border-radius: 999px;
        background: var(--cp-accent);
      }

      .route-badge[data-type*="train"]::before,
      .route-badge[data-type*="rail"]::before,
      .route-badge[data-type*="transit"]::before {
        background: var(--cp-success);
      }

      .route-badge[data-type*="walk"]::before,
      .route-badge[data-type*="walking"]::before {
        background: var(--cp-warning);
      }

      .route-badge[data-type*="split"]::before {
        background: var(--cp-link);
      }

      .cta-row {
        margin-top: 18px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        border: 1px solid var(--cp-border-strong);
        border-radius: 0.625rem;
        padding: 9px 13px;
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        font-weight: 800;
      }

      .btn:hover {
        background: var(--cp-accent-hover);
        color: var(--cp-accent-fg);
        text-decoration: none;
      }

      .btn-secondary {
        background: var(--cp-surface);
        color: var(--cp-text);
      }

      .btn-secondary:hover {
        background: var(--cp-surface-soft);
        color: var(--cp-text);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        overflow: hidden;
      }

      .panel-head,
      .segment-head {
        border-bottom: 1px solid var(--cp-border);
        background: var(--cp-bg-elevated);
        padding: 14px 16px;
      }

      .panel-head h2,
      .segment-head h2 {
        margin: 0 0 4px;
        font-size: 1.08rem;
      }

      .panel-head p,
      .segment-head p {
        margin: 0;
        color: var(--cp-text-muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .route-visual {
        display: block;
        width: 100%;
        min-height: 420px;
        background: var(--cp-surface);
      }

      .route-line {
        fill: none;
        stroke: var(--cp-accent);
        stroke-width: 7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .route-shadow {
        fill: none;
        stroke: var(--cp-accent-soft);
        stroke-width: 18;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .connector-line {
        fill: none;
        stroke: var(--cp-border-strong);
        stroke-width: 3;
        stroke-dasharray: 9 9;
        stroke-linecap: round;
      }

      .segment-label,
      .stop-label,
      .time-label,
      .stop-number {
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
      }

      .segment-label {
        fill: var(--cp-text-muted);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .stop-pin {
        fill: var(--cp-accent);
        stroke: var(--cp-accent-fg);
        stroke-width: 4;
      }

      .stop-number {
        fill: var(--cp-accent-fg);
        font-size: 16px;
        font-weight: 900;
        text-anchor: middle;
        dominant-baseline: middle;
      }

      .stop-label {
        fill: var(--cp-text);
        font-size: 15px;
        font-weight: 800;
      }

      .time-label {
        fill: var(--cp-text-muted);
        font-size: 12px;
      }

      .side-panel {
        display: grid;
        gap: 14px;
      }

      .notes {
        padding: 16px;
      }

      .notes h2 {
        margin-bottom: 8px;
        font-size: 1.08rem;
      }

      .notes ul {
        margin: 0;
        padding-left: 20px;
        color: var(--cp-text-muted);
        line-height: 1.55;
      }

      .segment {
        overflow: hidden;
      }

      .stop-list {
        display: grid;
        gap: 10px;
        padding: 12px;
      }

      .stop-card {
        display: grid;
        gap: 8px;
        padding: 14px;
        background: var(--cp-surface);
        box-shadow: none;
      }

      .stop-card h3 {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 0;
        font-size: 1rem;
      }

      .stop-order {
        display: inline-grid;
        place-items: center;
        min-width: 28px;
        height: 28px;
        border-radius: 999px;
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        font-size: 0.85rem;
        font-weight: 900;
      }

      .stop-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--cp-text-muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .stop-card p {
        margin: 0;
        color: var(--cp-text-muted);
        line-height: 1.5;
      }

      .empty-state {
        padding: clamp(18px, 4vw, 30px);
      }

      .empty-state p {
        color: var(--cp-text-muted);
        line-height: 1.55;
      }

      .status-message {
        padding: 16px;
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        color: var(--cp-text-muted);
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .route-visual {
          min-height: 360px;
        }
      }

      @media (max-width: 600px) {
        .wrap {
          padding: 14px;
        }

        .route-visual {
          min-height: 300px;
        }
      }
    </style>
  </head>
  <body data-nav-root="..">
    <main class="wrap">
      <section class="hero" id="hero">
        <p class="eyebrow" id="eyebrow">Route viewer</p>
        <div class="badge-row" id="badgeRow" hidden></div>
        <h1 id="title">Loading route...</h1>
        <p class="summary" id="summary">Fetching route details.</p>
        <div class="cta-row" id="actions" hidden></div>
      </section>

      <div id="content" class="status-message" role="status">Loading route data...</div>
    </main>

    <script>
      const svgNamespace = "http://www.w3.org/2000/svg";
      const params = new URLSearchParams(window.location.search);
      const parsedDay = Number(params.get("day") || 1);
      const dayNumber = Number.isFinite(parsedDay) && parsedDay > 0 ? Math.floor(parsedDay) : 1;

      const $ = (id) => document.getElementById(id);

      function setText(id, value) {
        $(id).textContent = value || "";
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function createEl(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function createLink(className, href, label, external) {
        const link = document.createElement("a");
        link.className = className;
        link.href = href;
        link.textContent = label;
        if (external) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
        return link;
      }

      function createSvgEl(tag, attrs = {}) {
        const node = document.createElementNS(svgNamespace, tag);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      }

      function stopSortValue(stop, fallback) {
        const numeric = Number(stop.order);
        return Number.isFinite(numeric) ? numeric : fallback;
      }

      function getAllStops(segments) {
        return segments.flatMap((segment, segmentIndex) =>
          (segment.stops || []).map((stop, stopIndex) => ({
            ...stop,
            segmentIndex,
            stopIndex,
            displayOrder: stop.order || stopIndex + 1,
          })),
        );
      }

      function buildPath(points) {
        if (!points.length) return "";
        return points
          .map((point, index) => `${index === 0 ? "M" : "L"} ${point.x} ${point.y}`)
          .join(" ");
      }

      function stopLabel(stop) {
        return stop.label || stop.area || `Stop ${stop.displayOrder}`;
      }

      function showEmptyRoute(message) {
        setText("eyebrow", `Day ${dayNumber} route`);
        setText("title", "No route visualization available");
        setText("summary", message || `Day ${dayNumber} does not have a route entry yet.`);
        $("badgeRow").hidden = true;
        const actions = $("actions");
        clear(actions);
        actions.hidden = false;
        actions.appendChild(
          createLink("btn btn-secondary", `day-view.html?day=${dayNumber}`, `Back to Day ${dayNumber} itinerary`, false),
        );

        const content = $("content");
        content.className = "empty-state";
        content.removeAttribute("role");
        clear(content);
        const p = createEl(
          "p",
          "",
          "The shared route viewer is ready, but this day is intentionally not mapped or the route data could not be found.",
        );
        content.appendChild(p);
      }

      function renderHero(route) {
        setText("eyebrow", `Day ${route.dayNumber} route`);
        setText("title", route.title || `Day ${route.dayNumber} Route`);
        setText("summary", route.summary || "High-level route progression for the day.");

        const badgeRow = $("badgeRow");
        clear(badgeRow);
        const badge = createEl("span", "route-badge", route.routeType || "Route");
        badge.dataset.type = String(route.routeType || "").toLowerCase();
        badgeRow.appendChild(badge);
        badgeRow.hidden = false;

        const actions = $("actions");
        clear(actions);
        if (route.mapUrl) {
          actions.appendChild(createLink("btn", route.mapUrl, "Open full route in Google Maps", true));
        }
        actions.appendChild(
          createLink("btn btn-secondary", `day-view.html?day=${route.dayNumber}`, `Back to Day ${route.dayNumber} itinerary`, false),
        );
        actions.hidden = false;
      }

      function renderRouteSvg(route) {
        const segments = Array.isArray(route.segments) ? route.segments : [];
        const stops = getAllStops(segments).sort((a, b) =>
          stopSortValue(a, a.stopIndex) - stopSortValue(b, b.stopIndex),
        );
        const width = 920;
        const rowGap = 132;
        const height = Math.max(320, 120 + segments.length * rowGap);
        const svg = createSvgEl("svg", {
          class: "route-visual",
          viewBox: `0 0 ${width} ${height}`,
          role: "img",
          "aria-labelledby": "mapTitle mapDesc",
        });

        const title = createSvgEl("title", { id: "mapTitle" });
        title.textContent = `${route.title || "Route"} abstract progression`;
        svg.appendChild(title);
        const desc = createSvgEl("desc", { id: "mapDesc" });
        desc.textContent = "Abstract route progression showing stops grouped by segment. It is not a geographic map.";
        svg.appendChild(desc);

        const positionedStops = [];
        segments.forEach((segment, segmentIndex) => {
          const segmentStops = (segment.stops || []).map((stop, stopIndex) => ({
            ...stop,
            segmentIndex,
            stopIndex,
            displayOrder: stop.order || stopIndex + 1,
          }));
          const y = 86 + segmentIndex * rowGap;
          const count = Math.max(segmentStops.length, 1);
          const startX = 90;
          const endX = width - 90;
          const step = count === 1 ? 0 : (endX - startX) / (count - 1);

          const segmentText = createSvgEl("text", {
            class: "segment-label",
            x: startX,
            y: Math.max(24, y - 42),
          });
          segmentText.textContent = segment.label || `Segment ${segmentIndex + 1}`;
          svg.appendChild(segmentText);

          const points = segmentStops.map((stop, stopIndex) => ({
            x: count === 1 ? width / 2 : startX + step * stopIndex,
            y: y + (stopIndex % 2 === 0 ? 0 : 22),
            stop,
          }));
          positionedStops.push(...points);

          if (points.length > 1) {
            svg.appendChild(createSvgEl("path", { class: "route-shadow", d: buildPath(points) }));
            svg.appendChild(createSvgEl("path", { class: "route-line", d: buildPath(points) }));
          }
        });

        for (let index = 1; index < positionedStops.length; index += 1) {
          if (positionedStops[index - 1].stop.segmentIndex !== positionedStops[index].stop.segmentIndex) {
            svg.appendChild(
              createSvgEl("path", {
                class: "connector-line",
                d: buildPath([positionedStops[index - 1], positionedStops[index]]),
              }),
            );
          }
        }

        positionedStops.forEach((point) => {
          const group = createSvgEl("g");
          const order = String(point.stop.displayOrder);
          const label = stopLabel(point.stop);
          const labelX = point.x > width - 250 ? point.x - 150 : point.x + 24;
          const textAnchor = point.x > width - 250 ? "end" : "start";

          group.appendChild(createSvgEl("circle", { class: "stop-pin", cx: point.x, cy: point.y, r: 18 }));
          const number = createSvgEl("text", { class: "stop-number", x: point.x, y: point.y + 1 });
          number.textContent = order;
          group.appendChild(number);

          const stopText = createSvgEl("text", {
            class: "stop-label",
            x: labelX,
            y: point.y - 6,
            "text-anchor": textAnchor,
          });
          stopText.textContent = label;
          group.appendChild(stopText);

          const timeText = createSvgEl("text", {
            class: "time-label",
            x: labelX,
            y: point.y + 14,
            "text-anchor": textAnchor,
          });
          timeText.textContent = point.stop.time || point.stop.area || "";
          group.appendChild(timeText);
          svg.appendChild(group);
        });

        if (!stops.length) {
          const empty = createSvgEl("text", {
            class: "stop-label",
            x: width / 2,
            y: height / 2,
            "text-anchor": "middle",
          });
          empty.textContent = "No stops defined for this route.";
          svg.appendChild(empty);
        }

        return svg;
      }

      function renderNotes(route) {
        const notes = Array.isArray(route.notes) ? route.notes.filter(Boolean) : [];
        if (!notes.length) return null;
        const panel = createEl("section", "panel notes");
        const heading = createEl("h2", "", "Notes");
        const list = createEl("ul");
        notes.forEach((note) => {
          const item = createEl("li", "", note);
          list.appendChild(item);
        });
        panel.append(heading, list);
        return panel;
      }

      function renderStopCards(route) {
        const container = createEl("aside", "side-panel");
        container.setAttribute("aria-label", `Day ${route.dayNumber} route segments`);
        (route.segments || []).forEach((segment, segmentIndex) => {
          const section = createEl("section", "segment");
          const head = createEl("div", "segment-head");
          head.appendChild(createEl("h2", "", segment.label || `Segment ${segmentIndex + 1}`));
          head.appendChild(
            createEl("p", "", `${(segment.stops || []).length} stop${(segment.stops || []).length === 1 ? "" : "s"}`),
          );
          section.appendChild(head);

          const stopList = createEl("div", "stop-list");
          (segment.stops || []).forEach((stop, stopIndex) => {
            const card = createEl("article", "stop-card");
            const title = createEl("h3");
            title.appendChild(createEl("span", "stop-order", String(stop.order || stopIndex + 1)));
            title.appendChild(document.createTextNode(stopLabel(stop)));
            card.appendChild(title);

            const meta = createEl("div", "stop-meta");
            if (stop.time) meta.appendChild(createEl("span", "", stop.time));
            if (stop.area) meta.appendChild(createEl("span", "", stop.area));
            if (meta.children.length) card.appendChild(meta);
            if (stop.summary) card.appendChild(createEl("p", "", stop.summary));
            if (stop.mapsUrl) {
              card.appendChild(createLink("", stop.mapsUrl, "Open stop in Google Maps", true));
            }
            stopList.appendChild(card);
          });
          section.appendChild(stopList);
          container.appendChild(section);
        });
        return container;
      }

      function renderRoute(route) {
        renderHero(route);
        const content = $("content");
        content.className = "layout";
        content.removeAttribute("role");
        clear(content);

        const visualPanel = createEl("section", "panel");
        visualPanel.setAttribute("aria-labelledby", "routeProgressionTitle");
        const head = createEl("div", "panel-head");
        head.appendChild(createEl("h2", "", "Route progression"));
        head.querySelector("h2").id = "routeProgressionTitle";
        head.appendChild(
          createEl("p", "", "Abstract stop order by segment. Use Google Maps for exact turn-by-turn navigation."),
        );
        visualPanel.appendChild(head);
        visualPanel.appendChild(renderRouteSvg(route));

        const side = createEl("div", "side-panel");
        const notes = renderNotes(route);
        if (notes) side.appendChild(notes);
        side.appendChild(renderStopCards(route));
        content.append(visualPanel, side);
      }

      async function init() {
        try {
          const response = await fetch("../data/routes.json");
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const routes = await response.json();
          const route = Array.isArray(routes)
            ? routes.find((item) => Number(item.dayNumber) === dayNumber)
            : null;
          if (!route) {
            showEmptyRoute(`Day ${dayNumber} does not have a saved route visualization.`);
            return;
          }
          renderRoute(route);
        } catch (error) {
          console.error("routes.json load failed:", error);
          showEmptyRoute(`Could not load route data for Day ${dayNumber}.`);
        }
      }

      init();
    </script>
  </body>
</html>
