<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Trip Route Viewer</title>
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme =
          param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --cp-bg: #f7f4ef;
        --cp-bg-elevated: #fcfbf8;
        --cp-surface: #ffffff;
        --cp-surface-soft: #f5f5f5;
        --cp-border: #dedede;
        --cp-border-strong: #919191;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-text-soft: #6f6f6f;
        --cp-accent: #b11f4b;
        --cp-accent-hover: #9a1a41;
        --cp-accent-soft: rgba(177, 31, 75, 0.08);
        --cp-accent-fg: #ffffff;
        --cp-success: #16a34a;
        --cp-danger: #dc2626;
        --cp-warning: #f59e0b;
        --cp-link: #0078d4;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
        --cp-overlay: rgba(255, 255, 255, 0.8);
        --cp-panel: rgba(255, 255, 255, 0.86);
        --cp-panel-strong: rgba(255, 255, 255, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.55);
        --cp-highlight: rgba(177, 31, 75, 0.12);
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --cp-bg: #3d3b3a;
        --cp-bg-elevated: #343231;
        --cp-surface: #292929;
        --cp-surface-soft: #2e2e2e;
        --cp-border: #474747;
        --cp-border-strong: #5f5f5f;
        --cp-text: #dedede;
        --cp-text-muted: #919191;
        --cp-text-soft: #b0b0b0;
        --cp-accent: #fd8ea1;
        --cp-accent-hover: #fb7b91;
        --cp-accent-soft: rgba(253, 142, 161, 0.14);
        --cp-accent-fg: #1a1a1a;
        --cp-success: #4ade80;
        --cp-danger: #f87171;
        --cp-warning: #fbbf24;
        --cp-link: #4da6ff;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
        --cp-overlay: rgba(41, 41, 41, 0.88);
        --cp-panel: rgba(41, 41, 41, 0.72);
        --cp-panel-strong: rgba(41, 41, 41, 0.96);
        --cp-sheen: rgba(255, 255, 255, 0.04);
        --cp-highlight: rgba(253, 142, 161, 0.12);
      }
    </style>
    <script src="../assets/scripts/theme.js?v=20260507a"></script>
    <link rel="stylesheet" href="../assets/styles/theme.css?v=20260507a" />
    <link rel="stylesheet" href="../assets/styles/site-nav.css?v=20260507d" />
    <script defer src="../assets/scripts/site-nav.js?v=20260521a"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--cp-text);
        background: var(--cp-bg);
      }

      a {
        color: var(--cp-link);
        text-decoration: none;
      }

      a:hover {
        color: var(--cp-accent-hover);
        text-decoration: underline;
      }

      .wrap {
        width: min(1180px, 100%);
        margin: 0 auto;
        padding: 20px;
      }

      .hero,
      .panel,
      .empty-state {
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        box-shadow: var(--cp-shadow);
      }

      .hero {
        padding: clamp(18px, 4vw, 32px);
        margin-bottom: 16px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--cp-text-muted);
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 10px;
        font-size: clamp(2rem, 4vw, 3.35rem);
        line-height: 1.05;
      }

      .summary {
        max-width: 820px;
        margin-bottom: 0;
        color: var(--cp-text-muted);
        font-size: 1.06rem;
        line-height: 1.6;
      }

      .badge-row,
      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .badge-row {
        margin-bottom: 14px;
      }

      .route-badge {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--cp-border-strong);
        border-radius: 999px;
        padding: 5px 11px;
        background: var(--cp-surface-soft);
        color: var(--cp-text);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .route-badge::before {
        content: "";
        width: 0.7em;
        height: 0.7em;
        margin-right: 0.45em;
        border-radius: 999px;
        background: var(--cp-accent);
      }

      .route-badge[data-type*="train"]::before,
      .route-badge[data-type*="rail"]::before,
      .route-badge[data-type*="transit"]::before {
        background: var(--cp-success);
      }

      .route-badge[data-type*="walk"]::before,
      .route-badge[data-type*="walking"]::before {
        background: var(--cp-warning);
      }

      .route-badge[data-type*="split"]::before {
        background: var(--cp-link);
      }

      .cta-row {
        margin-top: 18px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        border: 1px solid var(--cp-border-strong);
        border-radius: 0.625rem;
        padding: 9px 13px;
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        font-weight: 800;
      }

      .btn:hover {
        background: var(--cp-accent-hover);
        color: var(--cp-accent-fg);
        text-decoration: none;
      }

      .btn-secondary {
        background: var(--cp-surface);
        color: var(--cp-text);
      }

      .btn-secondary:hover {
        background: var(--cp-surface-soft);
        color: var(--cp-text);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(320px, 0.8fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        overflow: hidden;
      }

      .panel-head {
        border-bottom: 1px solid var(--cp-border);
        background: var(--cp-bg-elevated);
        padding: 14px 16px;
      }

      .panel-head h2 {
        margin: 0 0 4px;
        font-size: 1.08rem;
      }

      .panel-head p {
        margin: 0;
        color: var(--cp-text-muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .time-route {
        display: grid;
        gap: 12px;
        padding: 14px;
        background: var(--cp-surface);
      }

      .time-route-legend {
        margin: 0;
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        padding: 10px 12px;
        background: var(--cp-bg-elevated);
        color: var(--cp-text-muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .time-segment-label {
        margin: 12px 0 2px;
        color: var(--cp-text-muted);
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .time-stop {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }

      .time-pin {
        display: inline-grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        font-size: 0.95rem;
        font-weight: 900;
      }

      .time-card {
        display: grid;
        gap: 6px;
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        padding: 12px;
        background: var(--cp-panel-strong);
      }

      .time-card h3 {
        margin: 0;
        font-size: 1rem;
      }

      .time-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--cp-text-muted);
        font-size: 0.9rem;
        font-weight: 700;
      }

      .time-card p {
        margin: 0;
        color: var(--cp-text-muted);
        line-height: 1.5;
      }

      .time-gap {
        display: grid;
        grid-template-columns: 36px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }

      .time-gap-spine {
        justify-self: center;
        width: 3px;
        height: 38px;
        border-radius: 999px;
        background: var(--cp-border-strong);
      }

      .time-gap-content {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
      }

      .time-gap-track {
        height: 10px;
        border-radius: 999px;
        background: var(--cp-surface-soft);
        overflow: hidden;
      }

      .time-gap-bar {
        width: var(--gap-width, 28%);
        min-width: 18px;
        height: 100%;
        border-radius: inherit;
        background: var(--cp-accent);
      }

      .time-gap-label {
        color: var(--cp-text-muted);
        font-size: 0.86rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .side-panel {
        display: grid;
        gap: 14px;
      }

      .notes {
        padding: 16px;
      }

      .notes h2 {
        margin-bottom: 8px;
        font-size: 1.08rem;
      }

      .notes ul {
        margin: 0;
        padding-left: 20px;
        color: var(--cp-text-muted);
        line-height: 1.55;
      }

      .map-panel {
        overflow: hidden;
      }

      .map-body {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .map-frame {
        width: 100%;
        min-height: 420px;
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        background: var(--cp-surface-soft);
      }

      .map-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .guide-link-pill {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        width: fit-content;
        border: 1px solid var(--cp-border);
        border-radius: 999px;
        padding: 4px 9px;
        background: var(--cp-accent-soft);
        color: var(--cp-link);
        font-size: 0.84rem;
        font-weight: 800;
      }

      .map-note {
        margin: 0;
        color: var(--cp-text-muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }

      .map-fallback {
        border: 1px solid var(--cp-border);
        border-radius: 0.625rem;
        padding: 16px;
        background: var(--cp-surface-soft);
        color: var(--cp-text-muted);
        line-height: 1.5;
      }

      .empty-state {
        padding: clamp(18px, 4vw, 30px);
      }

      .empty-state p {
        color: var(--cp-text-muted);
        line-height: 1.55;
      }

      .status-message {
        padding: 16px;
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        color: var(--cp-text-muted);
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .time-gap-content {
          grid-template-columns: 1fr;
          gap: 6px;
        }
      }

      @media (max-width: 600px) {
        .wrap {
          padding: 14px;
        }

        .time-route {
          padding: 10px;
        }

        .time-gap-label {
          white-space: normal;
        }

        .map-frame {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body data-nav-root="..">
    <main class="wrap">
      <section class="hero" id="hero">
        <p class="eyebrow" id="eyebrow">Route viewer</p>
        <div class="badge-row" id="badgeRow" hidden></div>
        <h1 id="title">Loading route...</h1>
        <p class="summary" id="summary">Fetching route details.</p>
        <div class="cta-row" id="actions" hidden></div>
      </section>

      <div id="content" class="status-message" role="status">Loading route data...</div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const parsedDay = Number(params.get("day") || 1);
      const dayNumber = Number.isFinite(parsedDay) && parsedDay > 0 ? Math.floor(parsedDay) : 1;
      let cityGuideLinks = [];

      const $ = (id) => document.getElementById(id);

      function setText(id, value) {
        $(id).textContent = value || "";
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function createEl(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text) node.textContent = text;
        return node;
      }

      function createLink(className, href, label, external) {
        const link = document.createElement("a");
        link.className = className;
        link.href = href;
        link.textContent = label;
        if (external) {
          link.target = "_blank";
          link.rel = "noopener noreferrer";
        }
        return link;
      }

      function isTermBoundary(text, index, length) {
        const wordChar = /[\p{L}\p{N}_-]/u;
        const previous = text[index - 1];
        const next = text[index + length];
        return (
          (!previous || !wordChar.test(previous)) &&
          (!next || !wordChar.test(next))
        );
      }

      function buildCityGuideLinks(anchors) {
        return Object.entries(anchors)
          .flatMap(([id, entry]) => {
            const name = typeof entry === "string" ? entry : entry.name;
            const aliases = typeof entry === "string" ? [] : entry.aliases || [];
            return [name, ...aliases].map((term) => ({
              id,
              name: term,
              lowerName: term.toLocaleLowerCase(),
            }));
          })
          .sort((a, b) => b.name.length - a.name.length);
      }

      function findCityGuideLink(values) {
        const text = values.filter(Boolean).join("\n");
        const lowerText = text.toLocaleLowerCase();
        let bestMatch = null;

        cityGuideLinks.forEach((link) => {
          let index = lowerText.indexOf(link.lowerName);
          while (index !== -1) {
            if (isTermBoundary(text, index, link.name.length)) {
              if (
                !bestMatch ||
                index < bestMatch.index ||
                (index === bestMatch.index &&
                  link.name.length > bestMatch.link.name.length)
              ) {
                bestMatch = { index, link };
              }
              break;
            }
            index = lowerText.indexOf(link.lowerName, index + 1);
          }
        });

        return bestMatch?.link || null;
      }

      function stopSortValue(stop, fallback) {
        const numeric = Number(stop.order);
        return Number.isFinite(numeric) ? numeric : fallback;
      }

      function getAllStops(segments) {
        return segments.flatMap((segment, segmentIndex) =>
          (segment.stops || []).map((stop, stopIndex) => ({
            ...stop,
            segmentIndex,
            stopIndex,
            displayOrder: stop.order || stopIndex + 1,
          })),
        );
      }

      function stopLabel(stop) {
        return stop.label || stop.area || `Stop ${stop.displayOrder}`;
      }

      function parseTimeToMinutes(value) {
        if (typeof value !== "string") return null;
        const match = value.match(/^(\d{1,2}):(\d{2})\s*([AP]M)$/i);
        if (!match) return null;
        let hour = Number(match[1]);
        const minute = Number(match[2]);
        const period = match[3].toUpperCase();
        if (!Number.isFinite(hour) || !Number.isFinite(minute)) return null;
        if (period === "PM" && hour !== 12) hour += 12;
        if (period === "AM" && hour === 12) hour = 0;
        return hour * 60 + minute;
      }

      function formatDuration(minutes) {
        if (!Number.isFinite(minutes) || minutes <= 0) return "next stop";
        if (minutes < 60) return `${minutes} min`;
        const hours = Math.floor(minutes / 60);
        const remainder = minutes % 60;
        return remainder ? `${hours} hr ${remainder} min` : `${hours} hr`;
      }

      function googleMapsEmbedUrl(mapUrl) {
        if (!mapUrl) return "";
        let source;
        try {
          source = new URL(mapUrl);
        } catch {
          return "";
        }
        const origin = source.searchParams.get("origin");
        const destination = source.searchParams.get("destination");
        if (!origin || !destination) return "";

        const embed = new URL("https://maps.google.com/maps");
        embed.searchParams.set("output", "embed");
        embed.searchParams.set("saddr", origin);
        const waypoints = (source.searchParams.get("waypoints") || "")
          .split("|")
          .map((value) => value.trim())
          .filter(Boolean);
        embed.searchParams.set("daddr", [...waypoints, destination].join(" to:"));
        return embed.toString();
      }

      function showEmptyRoute(message) {
        setText("eyebrow", `Day ${dayNumber} route`);
        setText("title", "No route visualization available");
        setText("summary", message || `Day ${dayNumber} does not have a route entry yet.`);
        $("badgeRow").hidden = true;
        const actions = $("actions");
        clear(actions);
        actions.hidden = false;
        actions.appendChild(
          createLink("btn btn-secondary", `day-view.html?day=${dayNumber}`, `Back to Day ${dayNumber} itinerary`, false),
        );

        const content = $("content");
        content.className = "empty-state";
        content.removeAttribute("role");
        clear(content);
        const p = createEl(
          "p",
          "",
          "The shared route viewer is ready, but this day is intentionally not mapped or the route data could not be found.",
        );
        content.appendChild(p);
      }

      function renderHero(route) {
        setText("eyebrow", `Day ${route.dayNumber} route`);
        setText("title", route.title || `Day ${route.dayNumber} Route`);
        setText("summary", route.summary || "High-level route progression for the day.");

        const badgeRow = $("badgeRow");
        clear(badgeRow);
        const badge = createEl("span", "route-badge", route.routeType || "Route");
        badge.dataset.type = String(route.routeType || "").toLowerCase();
        badgeRow.appendChild(badge);
        badgeRow.hidden = false;

        const actions = $("actions");
        clear(actions);
        if (route.mapUrl) {
          actions.appendChild(createLink("btn", route.mapUrl, "Open full route in Google Maps", true));
        }
        actions.appendChild(
          createLink("btn btn-secondary", `day-view.html?day=${route.dayNumber}`, `Back to Day ${route.dayNumber} itinerary`, false),
        );
        actions.hidden = false;
      }

      function renderRouteTimeline(route) {
        const segments = Array.isArray(route.segments) ? route.segments : [];
        const stops = getAllStops(segments).sort((a, b) =>
          stopSortValue(a, a.stopIndex) - stopSortValue(b, b.stopIndex),
        );

        const container = createEl("div", "time-route");
        container.setAttribute("role", "list");
        container.setAttribute("aria-label", `${route.title || "Route"} time progression`);
        container.appendChild(
          createEl(
            "p",
            "time-route-legend",
            "Longer bars mean more scheduled time between stop anchors. This is a planning timeline, not physical map distance; open Google Maps for exact routing.",
          ),
        );

        if (!stops.length) {
          container.appendChild(createEl("p", "time-route-legend", "No stops defined for this route."));
          return container;
        }

        const timedGaps = stops
          .slice(0, -1)
          .map((stop, index) => {
            const current = parseTimeToMinutes(stop.time);
            const next = parseTimeToMinutes(stops[index + 1].time);
            return current !== null && next !== null ? Math.max(0, next - current) : null;
          })
          .filter((value) => value !== null);
        const maxGap = Math.max(30, ...timedGaps);
        let currentSegmentIndex = -1;

        stops.forEach((stop, index) => {
          if (stop.segmentIndex !== currentSegmentIndex) {
            currentSegmentIndex = stop.segmentIndex;
            const label = segments[currentSegmentIndex]?.label || `Segment ${currentSegmentIndex + 1}`;
            container.appendChild(createEl("h3", "time-segment-label", label));
          }

          const row = createEl("article", "time-stop");
          row.setAttribute("role", "listitem");
          row.appendChild(createEl("span", "time-pin", String(stop.displayOrder)));

          const card = createEl("div", "time-card");
          card.appendChild(createEl("h3", "", stopLabel(stop)));
          const meta = createEl("div", "time-meta");
          if (stop.time) meta.appendChild(createEl("span", "", stop.time));
          if (stop.area) meta.appendChild(createEl("span", "", stop.area));
          if (meta.children.length) card.appendChild(meta);
          if (stop.summary) card.appendChild(createEl("p", "", stop.summary));
          if (stop.mapsUrl) {
            card.appendChild(createLink("", stop.mapsUrl, "Open stop in Google Maps", true));
          }
          const guideLink = findCityGuideLink([
            stop.label,
            stop.area,
            stop.summary,
          ]);
          if (guideLink) {
            card.appendChild(
              createLink(
                "guide-link-pill",
                `../city-guide.html#${guideLink.id}`,
                `City guide: ${guideLink.name}`,
                false,
              ),
            );
          }
          row.appendChild(card);
          container.appendChild(row);

          if (index < stops.length - 1) {
            const current = parseTimeToMinutes(stop.time);
            const next = parseTimeToMinutes(stops[index + 1].time);
            const gapMinutes = current !== null && next !== null ? Math.max(0, next - current) : null;
            const width = gapMinutes === null ? 28 : Math.max(18, Math.min(100, Math.round((gapMinutes / maxGap) * 100)));
            const gap = createEl("div", "time-gap");
            gap.appendChild(createEl("span", "time-gap-spine"));
            const gapContent = createEl("div", "time-gap-content");
            const track = createEl("div", "time-gap-track");
            const bar = createEl("div", "time-gap-bar");
            bar.style.setProperty("--gap-width", `${width}%`);
            track.appendChild(bar);
            gapContent.appendChild(track);
            gapContent.appendChild(createEl("span", "time-gap-label", `Next: ${formatDuration(gapMinutes)}`));
            gap.appendChild(gapContent);
            container.appendChild(gap);
          }
        });

        return container;
      }

      function renderNotes(route) {
        const notes = Array.isArray(route.notes) ? route.notes.filter(Boolean) : [];
        if (!notes.length) return null;
        const panel = createEl("section", "panel notes");
        const heading = createEl("h2", "", "Notes");
        const list = createEl("ul");
        notes.forEach((note) => {
          const item = createEl("li", "", note);
          list.appendChild(item);
        });
        panel.append(heading, list);
        return panel;
      }

      function renderMapPanel(route) {
        const panel = createEl("section", "panel map-panel");
        panel.setAttribute("aria-labelledby", "routeMapTitle");
        const head = createEl("div", "panel-head");
        head.appendChild(createEl("h2", "", "Relative map"));
        head.querySelector("h2").id = "routeMapTitle";
        head.appendChild(createEl("p", "", "A live Google Maps preview for where the day moves from the starting point."));
        panel.appendChild(head);

        const body = createEl("div", "map-body");
        const embedUrl = googleMapsEmbedUrl(route.mapUrl);
        if (embedUrl) {
          const frame = document.createElement("iframe");
          frame.className = "map-frame";
          frame.src = embedUrl;
          frame.loading = "lazy";
          frame.referrerPolicy = "no-referrer-when-downgrade";
          frame.title = `Day ${route.dayNumber} Google Maps route preview`;
          body.appendChild(frame);
        } else {
          body.appendChild(
            createEl("p", "map-fallback", "Map preview is unavailable for this route, but the full Google Maps route is still linked below."),
          );
        }
        body.appendChild(
          createEl(
            "p",
            "map-note",
            "Use this as spatial context only. The left timeline remains the planning view; Google Maps handles live transit, walking, and traffic details.",
          ),
        );
        if (route.mapUrl) {
          const actions = createEl("div", "map-actions");
          actions.appendChild(createLink("btn", route.mapUrl, "Open full route", true));
          body.appendChild(actions);
        }
        panel.appendChild(body);
        return panel;
      }

      function renderRoute(route) {
        renderHero(route);
        const content = $("content");
        content.className = "layout";
        content.removeAttribute("role");
        clear(content);

        const visualPanel = createEl("section", "panel");
        visualPanel.setAttribute("aria-labelledby", "routeProgressionTitle");
        const head = createEl("div", "panel-head");
        head.appendChild(createEl("h2", "", "Route progression"));
        head.querySelector("h2").id = "routeProgressionTitle";
        head.appendChild(
          createEl("p", "", "Stop order by segment, with connector length based on scheduled time between anchors."),
        );
        visualPanel.appendChild(head);
        visualPanel.appendChild(renderRouteTimeline(route));

        const side = createEl("div", "side-panel");
        side.appendChild(renderMapPanel(route));
        const notes = renderNotes(route);
        if (notes) side.appendChild(notes);
        content.append(visualPanel, side);
      }

      async function init() {
        try {
          const [routeResult, anchorResult] = await Promise.allSettled([
            fetch("../data/routes.json"),
            fetch("../data/city-guide-anchors.json"),
          ]);
          if (routeResult.status !== "fulfilled") throw routeResult.reason;
          const response = routeResult.value;
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          if (anchorResult.status === "fulfilled" && anchorResult.value.ok) {
            cityGuideLinks = buildCityGuideLinks(await anchorResult.value.json());
          }
          const routes = await response.json();
          const route = Array.isArray(routes)
            ? routes.find((item) => Number(item.dayNumber) === dayNumber)
            : null;
          if (!route) {
            showEmptyRoute(`Day ${dayNumber} does not have a saved route visualization.`);
            return;
          }
          renderRoute(route);
        } catch (error) {
          console.error("routes.json load failed:", error);
          showEmptyRoute(`Could not load route data for Day ${dayNumber}.`);
        }
      }

      init();
    </script>
  </body>
</html>
