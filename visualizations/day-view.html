<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Trip Day Visualization</title>
    <script src="../assets/scripts/theme.js?v=20260507a"></script>
    <link rel="stylesheet" href="../assets/styles/theme.css?v=20260507a" />
    <link rel="stylesheet" href="../assets/styles/site-nav.css?v=20260507d" />
    <script defer src="../assets/scripts/site-nav.js?v=20260521a"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--cp-text);
        background:
          radial-gradient(
            circle at 10% 12%,
            var(--cp-accent-soft) 0,
            transparent 34%
          ),
          radial-gradient(
            circle at 85% 8%,
            var(--cp-highlight) 0,
            transparent 22%
          ),
          var(--cp-bg);
      }

      .webgl-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
        opacity: 0.35;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 20px;
        position: relative;
        z-index: 1;
      }

      .hero {
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        box-shadow: var(--cp-shadow);
        padding: 18px;
        margin-bottom: 16px;
      }

      .title {
        margin: 0;
        font-size: 1.9rem;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--cp-text-muted);
      }

      .btn {
        border: 1px solid var(--cp-border-strong);
        background: var(--cp-accent);
        color: var(--cp-accent-fg);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 0.9rem;
        font-family: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .btn:hover {
        background: var(--cp-accent-hover);
      }

      .btn-secondary {
        background: var(--cp-surface);
        color: var(--cp-text);
      }

      .btn-secondary:hover {
        background: var(--cp-surface-soft);
      }

      .card {
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-surface);
        box-shadow: var(--cp-shadow);
        overflow: hidden;
      }

      .head {
        padding: 14px;
        border-bottom: 1px solid var(--cp-border);
        background: var(--cp-bg-elevated);
      }

      .meta {
        margin: 0;
        color: var(--cp-text-muted);
        font-size: 0.9rem;
      }

      .name {
        margin: 6px 0 10px;
        font-size: 1.35rem;
      }

      .city-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .city-chip {
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 0.85rem;
        border: 1px solid var(--cp-border-strong);
        background: var(--cp-surface-soft);
      }

      .city-tokyo {
        border-color: var(--cp-link);
        color: var(--cp-link);
      }

      .city-kyoto {
        border-color: var(--cp-success);
        color: var(--cp-success);
      }

      .city-osaka {
        border-color: var(--cp-warning);
        color: var(--cp-warning);
      }

      .arrow {
        color: var(--cp-text-soft);
      }

      .transfer {
        margin-left: auto;
        font-size: 0.8rem;
        color: var(--cp-text-muted);
        border: 1px dashed var(--cp-border-strong);
        border-radius: 999px;
        padding: 4px 9px;
      }

      .parts {
        padding: 14px;
        display: grid;
        gap: 10px;
      }

      .part {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 10px;
        background: var(--cp-surface-soft);
      }

      .part h3 {
        margin: 0 0 6px;
        font-size: 0.95rem;
      }

      .part p {
        margin: 0;
        color: var(--cp-text-muted);
        line-height: 1.5;
      }

      .detail-list {
        margin: 0;
        padding-left: 18px;
        color: var(--cp-text-muted);
        line-height: 1.5;
      }

      .detail-list li {
        margin: 4px 0;
      }

      .time-plan {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 10px;
        background: var(--cp-surface-soft);
      }

      .traveler-brief {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 10px;
        background: var(--cp-bg-elevated);
      }

      .traveler-brief h3 {
        margin: 0 0 8px;
        color: var(--cp-accent);
        font-size: 0.95rem;
      }

      .brief-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .brief-item {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        background: var(--cp-surface);
        padding: 9px;
      }

      .brief-label {
        display: block;
        color: var(--cp-text);
        font-size: 0.8rem;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .brief-value {
        color: var(--cp-text-muted);
        font-size: 0.9rem;
        line-height: 1.4;
      }

      .time-plan h3 {
        margin: 0 0 8px;
        color: var(--cp-accent);
        font-size: 0.95rem;
      }

      .time-grid {
        display: grid;
        gap: 7px;
      }

      .time-row {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 10px;
        align-items: start;
        border-bottom: 1px solid var(--cp-border);
        padding-bottom: 6px;
      }

      .time-row:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .time-label {
        color: var(--cp-text);
        font-weight: 600;
        font-size: 0.86rem;
      }

      .time-activity {
        color: var(--cp-text-muted);
        font-size: 0.9rem;
        line-height: 1.45;
      }

      .part-morning h3,
      .part-day h3,
      .part-night h3 {
        color: var(--cp-warning);
      }

      .transit-card {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 10px;
        background: var(--cp-surface-soft);
      }

      .transit-card h3 {
        margin: 0 0 8px;
        color: var(--cp-accent);
        font-size: 0.95rem;
      }

      .transit-leg {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 6px;
        border-bottom: 1px solid var(--cp-border);
        text-decoration: none;
        color: inherit;
        border-radius: 6px;
        flex-wrap: wrap;
        transition: background 0.15s;
      }

      .transit-leg:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .transit-leg:hover {
        background: var(--cp-bg-elevated);
      }

      .transit-stop {
        color: var(--cp-text);
        font-weight: 500;
        font-size: 0.88rem;
      }

      .transit-arrow-icon {
        color: var(--cp-text-soft);
        font-size: 0.85rem;
      }

      .transit-line-badge {
        margin-left: auto;
        font-size: 0.78rem;
        background: var(--cp-bg-elevated);
        border: 1px solid var(--cp-border-strong);
        border-radius: 999px;
        padding: 2px 8px;
        color: var(--cp-text-muted);
        white-space: nowrap;
      }

      .transit-map-link {
        font-size: 0.8rem;
        color: var(--cp-link);
        white-space: nowrap;
      }

      .bookings-card {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 10px;
        background: var(--cp-surface-soft);
        border-left: 3px solid var(--cp-success, #27ae60);
      }

      .bookings-card h3 {
        margin: 0 0 8px;
        color: var(--cp-success, #27ae60);
        font-size: 0.95rem;
      }

      .booking-item {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding: 6px 4px;
        border-bottom: 1px solid var(--cp-border);
        flex-wrap: wrap;
        font-size: 0.88rem;
      }

      .booking-item:last-child { border-bottom: none; }

      .booking-name {
        font-weight: 600;
        color: var(--cp-text);
        flex: 1;
        min-width: 120px;
      }

      .booking-meta {
        font-size: 0.8rem;
        color: var(--cp-text-muted);
        white-space: nowrap;
      }

      .booking-conf {
        font-size: 0.78rem;
        font-family: monospace;
        background: var(--cp-bg-elevated);
        border: 1px solid var(--cp-border-strong);
        border-radius: 6px;
        padding: 1px 7px;
        color: var(--cp-text-muted);
        white-space: nowrap;
      }

      .booking-badge {
        font-size: 0.7rem;
        border-radius: 999px;
        padding: 1px 7px;
        font-weight: 600;
        white-space: nowrap;
      }

      .booking-badge.confirmed { background: #d4edda; color: #155724; }
      .booking-badge.walk-up   { background: #d1ecf1; color: #0c5460; }

      .booking-note {
        font-size: 0.78rem;
        color: #856404;
        background: #fff3cd;
        border: 1px solid #ffc107;
        border-radius: 6px;
        padding: 3px 8px;
        margin-top: 4px;
        width: 100%;
      }

      .foot {
        padding: 10px 14px 14px;
        color: var(--cp-text-soft);
        font-size: 0.9rem;
      }

      .pager {
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }

      .alert {
        margin: 12px 0;
        padding: 12px;
        border-radius: 12px;
        border-left: 4px solid;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .alert-critical {
        background: rgba(220, 38, 38, 0.08);
        border-left-color: var(--cp-danger);
        color: var(--cp-danger);
      }

      .alert-warning {
        background: rgba(245, 158, 11, 0.08);
        border-left-color: var(--cp-warning);
        color: var(--cp-warning);
      }

      .alert-split {
        background: rgba(59, 130, 246, 0.08);
        border-left-color: var(--cp-link);
        color: var(--cp-link);
      }

      .badge {
        display: inline-block;
        font-size: 0.75rem;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 12px;
        margin-right: 6px;
      }

      .badge-split {
        background: rgba(59, 130, 246, 0.1);
        color: var(--cp-link);
      }

      .badge-deadline-critical {
        background: rgba(220, 38, 38, 0.12);
        color: var(--cp-danger);
      }

      @media (max-width: 700px) {
        .wrap {
          padding: 14px;
        }

        .title {
          font-size: 1.45rem;
        }

        .brief-grid {
          grid-template-columns: 1fr;
        }
      }

      @media print {
        body {
          background: var(--cp-surface);
        }

        .wrap {
          max-width: none;
          padding: 0;
        }

        .hero,
        .pager {
          box-shadow: none;
        }

        .pager,
        .btn {
          display: none;
        }

        .card {
          box-shadow: none;
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body data-nav-root="..">
    <canvas id="dayWebglBg" class="webgl-bg" aria-hidden="true"></canvas>
    <main class="wrap">
      <section class="hero">
        <h1 class="title" id="pageTitle">Japan Day Visualization</h1>
        <p class="subtitle" id="pageSubtitle">
          Single-day Morning / Day / Night snapshot
        </p>
      </section>

      <article class="card" id="dayCard"></article>
      <div class="pager">
        <a class="btn btn-secondary" id="prevLink" href="#">Previous Day</a>
        <a class="btn btn-secondary" id="nextLink" href="#">Next Day</a>
      </div>
    </main>

    <script>
      async function init() {
        let days;
        try {
          const res = await fetch("../data/days.json");
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          days = await res.json();
        } catch (err) {
          document.getElementById("dayCard").innerHTML =
            `<p style="color:var(--cp-error,#c00);padding:1rem;">⚠️ Could not load day data. ${err.message}</p>`;
          console.error("days.json load failed:", err);
          return;
        }

        let cityGuideAnchors = {};
        try {
          const anchorRes = await fetch("../data/city-guide-anchors.json");
          if (anchorRes.ok) cityGuideAnchors = await anchorRes.json();
        } catch (e) {
          console.warn("city-guide-anchors.json load failed:", e);
        }

        const routeDayNumbers = new Set();
        try {
          const routeRes = await fetch("../data/routes.json");
          if (routeRes.ok) {
            const routes = await routeRes.json();
            if (Array.isArray(routes)) {
              routes.forEach((route) => {
                const routeDayNumber = Number(route.dayNumber);
                if (!Number.isNaN(routeDayNumber)) {
                  routeDayNumbers.add(routeDayNumber);
                }
              });
            }
          }
        } catch (e) {
          console.warn("routes.json load failed:", e);
        }

        let allBookings = {};
        try {
          const bookingsRes = await fetch("../data/bookings.json");
          if (bookingsRes.ok) allBookings = await bookingsRes.json();
        } catch (e) {
          console.warn("bookings.json load failed:", e);
        }

        const params = new URLSearchParams(window.location.search);
        const requestedDay = Number(params.get("day") || 1);
        const dayCount = days.length;
        const dayNumber = Number.isNaN(requestedDay)
          ? 1
          : Math.min(dayCount, Math.max(1, requestedDay));
        const item = days[dayNumber - 1];
        const brief = item.brief || {};

        // ── Booking date matching ──────────────────────────────────────
        const MONTH_NUM = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};

        function dateToOrdinal(s) {
          // "May 26" → 526, "Jun 1" → 601
          const m = s.match(/([A-Z][a-z]{2})\s+(\d+)/);
          return m ? (MONTH_NUM[m[1]] || 0) * 100 + parseInt(m[2], 10) : 0;
        }

        function parsePrimaryDate(rawDate) {
          // "Sun May 24 – Mon May 25" → "May 24"; "Tue May 26" → "May 26"
          const m = rawDate.match(/[A-Z][a-z]{2}\s+(\d+)/g);
          return m ? m[0] : rawDate.trim();
        }

        function bookingMatchesDate(booking, dateKey, category) {
          const dates = booking.dates || "";
          if (!dates) return false;
          const dn = dateToOrdinal(dateKey);
          if (!dn) return false;
          // Exact substring match (e.g. "May 26" in "May 26")
          if (dates.includes(dateKey)) return true;
          // For hotels: match check-in day only (start of range)
          if (category === "hotels") {
            const start = dates.match(/([A-Z][a-z]{2})\s+(\d+)/);
            return start ? dateToOrdinal(start[0]) === dn : false;
          }
          // For other categories: check if date falls within range
          const rangeMatch = dates.match(/([A-Z][a-z]{2})\s+(\d+)\s*[-–]\s*(?:([A-Z][a-z]{2})\s+)?(\d+)/);
          if (rangeMatch) {
            const startN = dateToOrdinal(`${rangeMatch[1]} ${rangeMatch[2]}`);
            const endMonth = rangeMatch[3] || rangeMatch[1];
            const endN = dateToOrdinal(`${endMonth} ${rangeMatch[4]}`);
            return dn >= startN && dn <= endN;
          }
          return false;
        }

        const itemDateKey = parsePrimaryDate(item.date);
        const relevantStatuses = new Set(["confirmed", "walk-up"]);
        const todayBookings = [];
        Object.entries(allBookings).forEach(([cat, items]) => {
          if (!Array.isArray(items)) return;
          items.forEach(b => {
            if (!relevantStatuses.has(b.status)) return;
            if (bookingMatchesDate(b, itemDateKey, cat)) {
              todayBookings.push({ ...b, _cat: cat });
            }
          });
        });

        function renderTodayBookings() {
          if (!todayBookings.length) return "";
          const rows = todayBookings.map(b => {
            const d = b.details || {};
            const confKey = ["Conf #","Res #","Booking ID","Rental ID"].find(k => d[k]);
            const timeKey = ["Time","Gate Departure","Depart","Depart Tokyo","Depart Shin-Osaka"].find(k => d[k]);
            const badge = `<span class="booking-badge ${b.status}">${b.status === "walk-up" ? "Walk-up" : "Confirmed"}</span>`;
            return `<div class="booking-item">
              <span class="booking-name">${escapeHtml(b.name)}</span>
              ${timeKey ? `<span class="booking-meta">🕐 ${escapeHtml(d[timeKey])}</span>` : ""}
              ${confKey ? `<span class="booking-conf">#&nbsp;${escapeHtml(d[confKey])}</span>` : ""}
              ${badge}
              ${b.notes ? `<span class="booking-note">⚠️ ${escapeHtml(b.notes)}</span>` : ""}
            </div>`;
          }).join("");
          return `<section class="bookings-card">
            <h3>📋 Today's Bookings</h3>
            <div class="bookings-list">${rows}</div>
          </section>`;
        }
        // ──────────────────────────────────────────────────────────────

        document.getElementById("pageTitle").textContent =
          `${item.dayLabel} Visualization`;
        document.getElementById("pageSubtitle").textContent =
          `${item.date} • ${item.title}`;
        document.title = `${item.dayLabel} — ${item.title} — Japan 2026`;

        const dayCard = document.getElementById("dayCard");

        const cityGuideLinks = Object.entries(cityGuideAnchors)
          .flatMap(([id, entry]) => {
            const name = typeof entry === "string" ? entry : entry.name;
            const aliases = typeof entry === "string" ? [] : entry.aliases || [];
            const suppressedBy =
              typeof entry === "string" ? [] : entry.suppressedBy || [];
            return [name, ...aliases].map((term) => ({
              id,
              name: term,
              lowerName: term.toLocaleLowerCase(),
              suppressedBy,
            }));
          })
          .sort((a, b) => b.name.length - a.name.length);

        function escapeHtml(value) {
          return String(value).replace(
            /[&<>"']/g,
            (char) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[char],
          );
        }

        function isTermBoundary(text, index, length) {
          const wordChar = /[\p{L}\p{N}_-]/u;
          const previous = text[index - 1];
          const next = text[index + length];
          return (
            (!previous || !wordChar.test(previous)) &&
            (!next || !wordChar.test(next))
          );
        }

        function findNextCityGuideLink(text) {
          const lowerText = text.toLocaleLowerCase();
          let bestMatch = null;

          cityGuideLinks.forEach((link) => {
            if (link.suppressedBy.some((id) => presentCityGuideIds.has(id))) return;

            let index = lowerText.indexOf(link.lowerName);
            while (index !== -1) {
              if (isTermBoundary(text, index, link.name.length)) {
                if (
                  !bestMatch ||
                  index < bestMatch.index ||
                  (index === bestMatch.index &&
                    link.name.length > bestMatch.link.name.length)
                ) {
                  bestMatch = { index, link };
                }
                break;
              }
              index = lowerText.indexOf(link.lowerName, index + 1);
            }
          });

          return bestMatch;
        }

        function collectDayText(day) {
          const fields = [
            day.morning,
            day.daytime,
            day.night,
            day.brief?.today,
            day.brief?.next,
            day.brief?.backup,
            day.brief?.ops,
            ...(day.details || []),
          ];
          (day.timeline || []).forEach((entry) => {
            if (!entry.url) fields.push(entry.activity);
          });
          return fields.filter((value) => typeof value === "string").join("\n");
        }

        function getPresentCityGuideIds(text) {
          return new Set(
            cityGuideLinks
              .filter((link) => {
                const lowerText = text.toLocaleLowerCase();
                let index = lowerText.indexOf(link.lowerName);
                while (index !== -1) {
                  if (isTermBoundary(text, index, link.name.length)) return true;
                  index = lowerText.indexOf(link.lowerName, index + 1);
                }
                return false;
              })
              .map((link) => link.id),
          );
        }

        const presentCityGuideIds = getPresentCityGuideIds(collectDayText(item));

        function linkCityGuideTerms(text, url) {
          if (typeof text !== "string") {
            return "";
          }

          if (url) {
            return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" style="color: var(--cp-link); text-decoration: none;">${escapeHtml(text)}</a>`;
          }

          let remaining = text;
          let result = "";

          while (remaining) {
            const match = findNextCityGuideLink(remaining);
            if (!match) {
              result += escapeHtml(remaining);
              break;
            }

            const matchedText = remaining.slice(
              match.index,
              match.index + match.link.name.length,
            );
            result += escapeHtml(remaining.slice(0, match.index));
            result += `<a href="../city-guide.html#${match.link.id}" class="guide-link">${escapeHtml(matchedText)}</a>`;
            remaining = remaining.slice(match.index + match.link.name.length);
          }

          return result;
        }

        dayCard.innerHTML = `
        <div class="head">
          <p class="meta">${escapeHtml(item.dayLabel)} • ${escapeHtml(item.date)}</p>
          <h2 class="name">${escapeHtml(item.title)}</h2>
          <div class="city-row">
            <span class="city-chip ${item.startCityClass}">${escapeHtml(item.startCity)}</span>
            <span class="arrow">-></span>
            <span class="city-chip ${item.endCityClass}">${escapeHtml(item.endCity)}</span>
            ${item.transfer ? `<span class="transfer">${escapeHtml(item.transfer)}</span>` : ""}
          </div>
        </div>
        ${
          item.deadline
            ? `<div class="alert alert-${item.deadline.type}">${escapeHtml(item.deadline.label)}</div>`
            : ""
        }
        ${
          item.splitDay
            ? `<div class="alert alert-split">🔀 Split Day: ${escapeHtml(item.splitNote)}</div>`
            : ""
        }
        ${
          dayNumber > 1 && routeDayNumbers.has(dayNumber)
            ? `<div class="alert alert-split">🗺️ Route view: <a href="route-view.html?day=${dayNumber}">View the Day ${dayNumber} map-style progression</a></div>`
            : ""
        }
        <div class="parts">
          ${renderTodayBookings()}
          <section class="traveler-brief">
            <h3>Today / Next / Backup</h3>
            <div class="brief-grid">
              <div class="brief-item"><span class="brief-label">Today</span><span class="brief-value">${linkCityGuideTerms(brief.today)}</span></div>
              <div class="brief-item"><span class="brief-label">Next</span><span class="brief-value">${linkCityGuideTerms(brief.next)}</span></div>
              <div class="brief-item"><span class="brief-label">Backup</span><span class="brief-value">${linkCityGuideTerms(brief.backup)}</span></div>
              <div class="brief-item"><span class="brief-label">Ops note</span><span class="brief-value">${linkCityGuideTerms(brief.ops)}</span></div>
            </div>
          </section>
          <section class="part part-morning">
            <h3>Morning</h3>
            <p>${linkCityGuideTerms(item.morning)}</p>
          </section>
          <section class="part part-day">
            <h3>Day</h3>
            <p>${linkCityGuideTerms(item.daytime)}</p>
          </section>
          <section class="part part-night">
            <h3>Night</h3>
            <p>${linkCityGuideTerms(item.night)}</p>
          </section>
          <section class="part">
            <h3>Details</h3>
            <ul class="detail-list">
              ${(item.details || []).map((detail) => `<li>${linkCityGuideTerms(detail)}</li>`).join("")}
            </ul>
          </section>
          ${(item.transit && item.transit.length > 0) ? `
          <section class="transit-card">
            <h3>🚇 Transit</h3>
            <div class="transit-list">
              ${item.transit.map((leg) => `
                <a href="${escapeHtml(leg.url)}" class="transit-leg" target="_blank" rel="noopener noreferrer">
                  <span class="transit-stop">${escapeHtml(leg.from)}</span>
                  <span class="transit-arrow-icon">→</span>
                  <span class="transit-stop">${escapeHtml(leg.to)}</span>
                  <span class="transit-line-badge">${escapeHtml(leg.line)}</span>
                  <span class="transit-map-link">🗺️ Map</span>
                </a>
              `).join("")}
            </div>
          </section>
          ` : ""}
          <section class="time-plan">
            <h3>Exact Time Plan</h3>
            <div class="time-grid">
              ${(item.timeline || [])
                .map(
                  (entry) => `
                    <div class="time-row">
                      <div class="time-label">${escapeHtml(entry.time)}</div>
                      <div class="time-activity">${linkCityGuideTerms(entry.activity, entry.url)}</div>
                    </div>
                  `,
                )
                .join("")}
            </div>
          </section>
        </div>
        <div class="foot">${escapeHtml(item.note)}</div>
      `;

        const prevLink = document.getElementById("prevLink");
        const nextLink = document.getElementById("nextLink");

        if (dayNumber > 1) {
          const prevNum = String(dayNumber - 1).padStart(2, "0");
          prevLink.href = `day-${prevNum}.html`;
          prevLink.textContent = `Previous Day (${dayNumber - 1})`;
        } else {
          prevLink.href = "../visual-schedule.html";
          prevLink.textContent = "Back to Planner";
        }

        if (dayNumber < dayCount) {
          const nextNum = String(dayNumber + 1).padStart(2, "0");
          nextLink.href = `day-${nextNum}.html`;
          nextLink.textContent = `Next Day (${dayNumber + 1})`;
        } else {
          nextLink.href = "../visual-schedule.html";
          nextLink.textContent = "Back to Planner";
        }
      }
      init();
    </script>
    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.165.0/build/three.module.js";

      const canvas = document.getElementById("dayWebglBg");
      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
      camera.position.set(0, 0, 11);

      // Dense particle field (Tokyo/Kyoto/Osaka palette)
      const pointCount = 720;
      const pointGeo = new THREE.BufferGeometry();
      const pointPos = new Float32Array(pointCount * 3);
      const pointCol = new Float32Array(pointCount * 3);
      const palette = [
        new THREE.Color(0xef476f),
        new THREE.Color(0xffd166),
        new THREE.Color(0x06d6a0),
        new THREE.Color(0x4dabf7),
      ];

      for (let i = 0; i < pointCount; i++) {
        pointPos[i * 3] = (Math.random() - 0.5) * 24;
        pointPos[i * 3 + 1] = (Math.random() - 0.5) * 14;
        pointPos[i * 3 + 2] = (Math.random() - 0.5) * 8;
        const c = palette[i % palette.length];
        pointCol[i * 3] = c.r;
        pointCol[i * 3 + 1] = c.g;
        pointCol[i * 3 + 2] = c.b;
      }
      pointGeo.setAttribute("position", new THREE.BufferAttribute(pointPos, 3));
      pointGeo.setAttribute("color", new THREE.BufferAttribute(pointCol, 3));

      const points = new THREE.Points(
        pointGeo,
        new THREE.PointsMaterial({
          size: 0.085,
          transparent: true,
          opacity: 0.7,
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        }),
      );
      scene.add(points);

      // Accent geometry for extra motion depth
      const ringA = new THREE.Mesh(
        new THREE.TorusGeometry(5.2, 0.06, 18, 140),
        new THREE.MeshBasicMaterial({
          color: 0x4dabf7,
          transparent: true,
          opacity: 0.2,
        }),
      );
      const ringB = new THREE.Mesh(
        new THREE.TorusGeometry(3.9, 0.05, 18, 120),
        new THREE.MeshBasicMaterial({
          color: 0xfd8ea1,
          transparent: true,
          opacity: 0.18,
        }),
      );
      ringB.rotation.x = Math.PI / 5;
      scene.add(ringA);
      scene.add(ringB);

      const glow = new THREE.Mesh(
        new THREE.SphereGeometry(1.4, 24, 24),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.05,
        }),
      );
      glow.position.set(0, 0.2, -2.5);
      scene.add(glow);

      let targetX = 0;
      let targetY = 0;
      window.addEventListener("pointermove", (e) => {
        targetX = (e.clientX / window.innerWidth - 0.5) * 0.7;
        targetY = (e.clientY / window.innerHeight - 0.5) * 0.45;
      });

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      resize();
      window.addEventListener("resize", resize);

      const posAttr = pointGeo.getAttribute("position");
      const basePos = posAttr.array.slice();
      let t = 0;

      function animate() {
        t += 0.006;

        for (let i = 0; i < pointCount; i++) {
          const i3 = i * 3;
          posAttr.array[i3] =
            basePos[i3] + Math.sin(t * 1.25 + i * 0.19) * 0.08;
          posAttr.array[i3 + 1] =
            basePos[i3 + 1] + Math.cos(t * 1.1 + i * 0.17) * 0.08;
        }
        posAttr.needsUpdate = true;

        points.rotation.y += 0.0008;
        ringA.rotation.z += 0.0014;
        ringB.rotation.z -= 0.0011;
        glow.scale.setScalar(1 + Math.sin(t * 2.2) * 0.05);

        camera.position.x += (targetX - camera.position.x) * 0.035;
        camera.position.y += (-targetY - camera.position.y) * 0.035;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    </script>
  </body>
</html>
