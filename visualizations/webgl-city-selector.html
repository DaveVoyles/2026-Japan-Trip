<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Japan Trip 3D City Selector</title>
    <link rel="stylesheet" href="../assets/styles/site-nav.css?v=20260507d" />
    <script defer src="../assets/scripts/site-nav.js?v=20260521a"></script>
    <style>
      :root {
        --cp-bg: #f7f4ef;
        --cp-surface: rgba(255, 255, 255, 0.9);
        --cp-border: #dedede;
        --cp-text: #242424;
        --cp-text-muted: #5c5c5c;
        --cp-accent: #b11f4b;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.14);
      }

      html[data-theme="dark"] {
        --cp-bg: #1f1f1f;
        --cp-surface: rgba(34, 34, 34, 0.86);
        --cp-border: #474747;
        --cp-text: #dedede;
        --cp-text-muted: #a8a8a8;
        --cp-accent: #fd8ea1;
        --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--cp-text);
        background:
          radial-gradient(
            circle at 12% 10%,
            rgba(177, 31, 75, 0.18) 0,
            transparent 36%
          ),
          radial-gradient(
            circle at 88% 12%,
            rgba(0, 120, 212, 0.12) 0,
            transparent 27%
          ),
          var(--cp-bg);
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 18px;
      }

      .hero {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        box-shadow: var(--cp-shadow);
        padding: 18px;
        margin-bottom: 14px;
      }

      .hero h1 {
        font-size: 1.6rem;
        margin-bottom: 6px;
      }

      .hero p {
        color: var(--cp-text-muted);
        margin-bottom: 10px;
      }

      .shell {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 12px;
      }

      .viz {
        position: relative;
        min-height: 520px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(
          160deg,
          rgba(8, 18, 34, 0.95),
          rgba(18, 11, 26, 0.96)
        );
        box-shadow: var(--cp-shadow);
      }

      #cityCanvas {
        width: 100%;
        height: 520px;
        display: block;
      }

      .panel {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        box-shadow: var(--cp-shadow);
        padding: 14px;
      }

      .panel h2 {
        font-size: 1.1rem;
        margin-bottom: 6px;
      }

      .panel p {
        color: var(--cp-text-muted);
        font-size: 0.88rem;
        margin-bottom: 10px;
      }

      .chip-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .chip {
        border: 1px solid var(--cp-border);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.8rem;
        color: var(--cp-text-muted);
      }

      .day-list {
        list-style: none;
        display: grid;
        gap: 8px;
      }

      .day-list a {
        text-decoration: none;
        display: block;
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 8px 10px;
        color: var(--cp-text);
        background: rgba(255, 255, 255, 0.02);
      }

      .day-list a:hover {
        border-color: var(--cp-accent);
        color: var(--cp-accent);
      }

      .city-hint {
        position: absolute;
        left: 12px;
        bottom: 12px;
        color: #f1f1f1;
        font-size: 0.84rem;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 10px;
        padding: 7px 10px;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        #cityCanvas,
        .viz {
          min-height: 420px;
          height: 420px;
        }
      }
    </style>
  </head>
  <body data-nav-root="..">
    <main class="wrap">
      <section class="hero">
        <h1>🛰️ 3D City Selector</h1>
        <p>
          Click a city node in the WebGL view to instantly filter days and jump
          to any itinerary page.
        </p>
      </section>

      <section class="shell">
        <div class="viz">
          <canvas id="cityCanvas"></canvas>
          <div class="city-hint">Tap Tokyo, Kyoto, or Osaka nodes.</div>
        </div>

        <aside class="panel">
          <h2 id="cityTitle">🗼 Tokyo</h2>
          <p id="cityDesc">
            Days focused on Tokyo neighborhoods, shopping, and return leg.
          </p>
          <div class="chip-row" id="cityChips"></div>
          <ul class="day-list" id="cityDays"></ul>
        </aside>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const cityData = {
        Tokyo: {
          icon: "🗼",
          desc: "Days focused on Tokyo neighborhoods, shopping, and return leg.",
          color: 0xef476f,
          days: [
            { label: "Day 1 — Travel and Arrival", href: "day-01.html" },
            { label: "Day 2 — Shibuya and Harajuku", href: "day-02.html" },
            {
              label: "Day 3 — Toyosu, Ginza & Roppongi Art",
              href: "day-03.html",
            },
            { label: "Day 4 — Asakusa and Akihabara", href: "day-04.html" },
            { label: "Day 9 — Osaka to Tokyo Return", href: "day-09.html" },
            { label: "Day 10 — Departure", href: "day-10.html" },
          ],
        },
        Kyoto: {
          icon: "⛩️",
          desc: "Temple-heavy Kyoto segment with Nara, Gion, and cultural core.",
          color: 0xffd166,
          days: [
            { label: "Day 5 — Tokyo to Kyoto", href: "day-05.html" },
            {
              label: "Day 6 — Nara Day Trip and Kiyomizu",
              href: "day-06.html",
            },
          ],
        },
        Osaka: {
          icon: "🐙",
          desc: "Food + arcade + market stretch centered around Osaka energy.",
          color: 0x06d6a0,
          days: [
            { label: "Day 7 — Kyoto to Osaka", href: "day-07.html" },
            { label: "Day 8 — Osaka Free Day", href: "day-08.html" },
          ],
        },
      };

      const cityTitle = document.getElementById("cityTitle");
      const cityDesc = document.getElementById("cityDesc");
      const cityChips = document.getElementById("cityChips");
      const cityDays = document.getElementById("cityDays");

      function renderCity(city) {
        const data = cityData[city];
        cityTitle.textContent = `${data.icon} ${city}`;
        cityDesc.textContent = data.desc;

        cityChips.innerHTML = "";
        const total = document.createElement("span");
        total.className = "chip";
        total.textContent = `Days: ${data.days.length}`;
        cityChips.appendChild(total);

        const focus = document.createElement("span");
        focus.className = "chip";
        focus.textContent = "Tap any day card to open";
        cityChips.appendChild(focus);

        cityDays.innerHTML = "";
        data.days.forEach((d) => {
          const li = document.createElement("li");
          li.innerHTML = `<a href="${d.href}">${d.label}</a>`;
          cityDays.appendChild(li);
        });
      }

      renderCity("Tokyo");

      const canvas = document.getElementById("cityCanvas");
      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x111827, 8, 26);

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

      const camera = new THREE.PerspectiveCamera(
        50,
        canvas.clientWidth / canvas.clientHeight,
        0.1,
        100,
      );
      camera.position.set(0, 3.7, 8.2);

      const controls = new OrbitControls(camera, canvas);
      controls.enableDamping = true;
      controls.enablePan = false;
      controls.minDistance = 4;
      controls.maxDistance = 14;
      controls.maxPolarAngle = Math.PI / 2.03;

      scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x0a0a12, 1.15));
      const dir = new THREE.DirectionalLight(0xffffff, 1.05);
      dir.position.set(5, 7, 4);
      scene.add(dir);

      const base = new THREE.Mesh(
        new THREE.CircleGeometry(6.8, 64),
        new THREE.MeshStandardMaterial({
          color: 0x101826,
          roughness: 0.9,
          metalness: 0.05,
        }),
      );
      base.rotation.x = -Math.PI / 2;
      scene.add(base);

      const nodes = [
        { name: "Tokyo", pos: new THREE.Vector3(-2.8, 0.45, 1.1) },
        { name: "Kyoto", pos: new THREE.Vector3(0.1, 0.42, -0.7) },
        { name: "Osaka", pos: new THREE.Vector3(2.6, 0.42, -1.4) },
      ];

      const meshes = [];
      nodes.forEach((n) => {
        const color = cityData[n.name].color;
        const mesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.58, 30, 30),
          new THREE.MeshStandardMaterial({
            color,
            emissive: color,
            emissiveIntensity: 0.2,
            roughness: 0.35,
            metalness: 0.2,
          }),
        );
        mesh.position.copy(n.pos);
        mesh.userData.city = n.name;
        scene.add(mesh);
        meshes.push(mesh);

        const halo = new THREE.Mesh(
          new THREE.SphereGeometry(0.93, 18, 18),
          new THREE.MeshBasicMaterial({
            color,
            transparent: true,
            opacity: 0.12,
          }),
        );
        halo.position.copy(n.pos);
        scene.add(halo);
      });

      function connect(a, b) {
        const curve = new THREE.QuadraticBezierCurve3(
          a.clone(),
          new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5).setY(1.8),
          b.clone(),
        );
        const geo = new THREE.TubeGeometry(curve, 40, 0.038, 10, false);
        const mat = new THREE.MeshBasicMaterial({ color: 0x4dabf7 });
        scene.add(new THREE.Mesh(geo, mat));
      }

      connect(nodes[0].pos, nodes[1].pos);
      connect(nodes[1].pos, nodes[2].pos);
      connect(nodes[2].pos, nodes[0].pos.clone().set(-1.4, 0.5, 2.0));

      const ray = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let active = null;

      function setActive(mesh) {
        if (active) active.material.emissiveIntensity = 0.2;
        active = mesh;
        active.material.emissiveIntensity = 0.42;
        renderCity(active.userData.city);
      }

      setActive(meshes[0]);

      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        ray.setFromCamera(pointer, camera);
        const hit = ray.intersectObjects(meshes)[0];
        if (hit) setActive(hit.object);
      });

      const clock = new THREE.Clock();
      function animate() {
        const t = clock.getElapsedTime();
        meshes.forEach((m, i) => {
          m.position.y = nodes[i].pos.y + Math.sin(t * 1.5 + i) * 0.07;
        });
        controls.update();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();

      function resize() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h, false);
      }
      window.addEventListener("resize", resize);
    </script>
  </body>
</html>
