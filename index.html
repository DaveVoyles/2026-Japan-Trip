<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 Japan Trip Visualizations</title>
    <script src="assets/scripts/theme.js?v=20260507a"></script>
    <link rel="stylesheet" href="assets/styles/theme.css?v=20260507a" />
    <link rel="stylesheet" href="assets/styles/site-nav.css?v=20260507d" />
    <script defer src="assets/scripts/site-nav.js?v=20260507d"></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Segoe UI",
          Aptos,
          Calibri,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: var(--cp-text);
        background:
          radial-gradient(
            circle at 10% 12%,
            var(--cp-accent-soft) 0,
            transparent 34%
          ),
          radial-gradient(
            circle at 85% 8%,
            var(--cp-highlight) 0,
            transparent 22%
          ),
          var(--cp-bg);
      }

      .wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .hero {
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        box-shadow: var(--cp-shadow);
        padding: 40px;
        margin-bottom: 32px;
        text-align: center;
      }

      .hero h1 {
        margin: 0 0 8px 0;
        font-size: 2.5rem;
        background: linear-gradient(135deg, var(--cp-accent), var(--cp-link));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .hero p {
        margin: 0;
        color: var(--cp-text-muted);
        font-size: 1.1rem;
      }

      .trip-details {
        display: flex;
        gap: 24px;
        justify-content: center;
        margin-top: 20px;
        flex-wrap: wrap;
      }

      .detail-item {
        background: var(--cp-surface);
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.95rem;
      }

      .detail-label {
        color: var(--cp-text-muted);
        font-size: 0.85rem;
        margin-bottom: 4px;
      }

      .detail-value {
        font-weight: 600;
        color: var(--cp-text);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
      }

      .card {
        border: 1px solid var(--cp-border);
        border-radius: 14px;
        background: var(--cp-surface);
        box-shadow: var(--cp-shadow);
        overflow: hidden;
        transition: all 0.3s ease;
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 24px 56px rgba(0, 0, 0, 0.15);
        border-color: var(--cp-accent);
      }

      .card-head {
        padding: 16px;
        background: var(--cp-bg-elevated);
        border-bottom: 1px solid var(--cp-border);
      }

      .card-day-label {
        font-size: 0.75rem;
        color: var(--cp-text-muted);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 8px 0;
        color: var(--cp-text);
      }

      .card-date {
        font-size: 0.9rem;
        color: var(--cp-text-soft);
        margin: 0;
      }

      .card-body {
        padding: 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .card-location {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }

      .city-chip {
        display: inline-block;
        border-radius: 20px;
        padding: 4px 10px;
        font-size: 0.8rem;
        font-weight: 500;
        border: 1px solid var(--cp-border);
        background: var(--cp-surface-soft);
      }

      .city-tokyo {
        border-color: var(--cp-city-tokyo-border);
        background: var(--cp-city-tokyo-bg);
        color: var(--cp-city-tokyo-text);
      }

      .city-kyoto {
        border-color: var(--cp-city-kyoto-border);
        background: var(--cp-city-kyoto-bg);
        color: var(--cp-city-kyoto-text);
      }

      .city-osaka {
        border-color: var(--cp-city-osaka-border);
        background: var(--cp-city-osaka-bg);
        color: var(--cp-city-osaka-text);
      }

      .arrow {
        color: var(--cp-text-muted);
        font-weight: 300;
      }

      .card-description {
        font-size: 0.95rem;
        color: var(--cp-text-soft);
        line-height: 1.5;
        margin: 0 0 12px 0;
        flex: 1;
      }

      .card-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--cp-link);
        font-weight: 600;
        text-decoration: none;
        transition: gap 0.2s ease;
      }

      .card:hover .card-link {
        gap: 10px;
      }

      .site-search {
        border: 1px solid var(--cp-border);
        border-radius: 16px;
        background: var(--cp-panel-strong);
        box-shadow: var(--cp-shadow);
        padding: 16px;
        margin-bottom: 24px;
      }

      .site-search label {
        display: block;
        margin-bottom: 8px;
        color: var(--cp-text);
        font-weight: 700;
      }

      .site-search input {
        width: 100%;
        border: 1px solid var(--cp-border-strong);
        border-radius: 10px;
        background: var(--cp-surface);
        color: var(--cp-text);
        font: inherit;
        padding: 10px 12px;
      }

      .search-results {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .search-result {
        border: 1px solid var(--cp-border);
        border-radius: 10px;
        background: var(--cp-surface);
        color: var(--cp-text);
        padding: 10px;
        text-decoration: none;
      }

      .search-result strong {
        display: block;
        margin-bottom: 4px;
      }

      .search-result span {
        color: var(--cp-text-muted);
        font-size: 0.88rem;
      }

      .search-empty {
        display: none;
        margin: 12px 0 0;
        color: var(--cp-text-muted);
      }

      .search-empty.is-visible {
        display: block;
      }

      .arrow-icon {
        display: inline-block;
      }

      @media (max-width: 768px) {
        .hero {
          padding: 24px;
        }

        .hero h1 {
          font-size: 1.8rem;
        }

        .trip-details {
          flex-direction: column;
          gap: 12px;
        }

        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-nav-root=".">
    <main class="wrap">
      <section class="hero">
        <h1>🗾 Japan Trip 2026</h1>
        <p>Interactive Day-by-Day Visualizations</p>
        <div class="trip-details">
          <div class="detail-item">
            <div class="detail-label">Duration</div>
            <div class="detail-value">10 Days</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Dates</div>
            <div class="detail-value">May 24 – Jun 3</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Cities</div>
            <div class="detail-value">Tokyo • Kyoto • Osaka</div>
          </div>
        </div>
      </section>

      <section class="site-search" aria-label="Search trip pages">
        <label for="siteSearch">Find trip info fast</label>
        <input
          id="siteSearch"
          type="search"
          placeholder="Search hotel, SmartEX, Nara, Haneda, Shibuya Sky..."
          autocomplete="off"
        />
        <div class="search-results" id="searchResults"></div>
        <p class="search-empty" id="searchEmpty">No matching trip pages found.</p>
      </section>

      <div class="grid" id="daysGrid"></div>
    </main>

    <script>
      const days = [
        {
          day: 1,
          date: "Sun May 24 - Mon May 25",
          title: "Travel and Arrival",
          startCity: "Newark",
          endCity: "Tokyo",
          description:
            "Depart for Japan, endure the long flight, and arrive at Haneda.",
        },
        {
          day: 2,
          date: "Tue May 26",
          title: "Shibuya and Harajuku",
          startCity: "Tokyo",
          endCity: "Tokyo",
          description:
            "Iconic Tokyo: Meiji Jingu, Takeshita Street, a booked 2:00 PM Shibuya Sky entry, and Shibuya Crossing.",
        },
        {
          day: 3,
          date: "Wed May 27",
          title: "Toyosu, Ginza & Roppongi Art",
          startCity: "Tokyo",
          endCity: "Tokyo",
          description:
            "Fresh seafood at Toyosu Market, Ginza shopping block, and an evening stop at Mori Art Museum in Roppongi.",
        },
        {
          day: 4,
          date: "Thu May 28",
          title: "Asakusa and Akihabara",
          startCity: "Tokyo",
          endCity: "Tokyo",
          description:
            "Old Tokyo at Yanaka or Senso-ji/Kappabashi, then Akihabara arcades.",
        },
        {
          day: 5,
          date: "Fri May 29",
          title: "Tokyo to Kyoto",
          startCity: "Tokyo",
          endCity: "Kyoto",
          description:
            "Shinkansen rail journey, Nishiki Market, and Gion's atmospheric evening.",
        },
        {
          day: 6,
          date: "Sat May 30",
          title: "Nara Day Trip & Kiyomizu",
          startCity: "Kyoto",
          endCity: "Kyoto",
          description:
            "Nara Park, Todai-ji, Nakatanidou, Kiyomizu-dera, and a slow Gion evening.",
        },
        {
          day: 7,
          date: "Sun May 31",
          title: "Kyoto to Osaka",
          startCity: "Kyoto",
          endCity: "Osaka",
          description:
            "Early Fushimi Inari torii walk, transfer to Osaka, and neon Dotonbori streets.",
        },
        {
          day: 8,
          date: "Mon Jun 1",
          title: "Osaka Free Day",
          startCity: "Osaka",
          endCity: "Osaka",
          description:
            "Osaka Castle, Kuromon Market, flexible split shopping (Den Den Town or Shinsaibashi).",
        },
        {
          day: 9,
          date: "Tue Jun 2",
          title: "Osaka to Tokyo Return",
          startCity: "Osaka",
          endCity: "Tokyo",
          description:
            "Low-risk final Osaka morning, return Shinkansen to Tokyo, hotel near Haneda.",
        },
        {
          day: 10,
          date: "Wed Jun 3",
          title: "Departure",
          startCity: "Tokyo",
          endCity: "In Transit",
          description:
            "Controlled final shopping, hard Haneda transfer buffer, and return flight to Newark.",
        },
      ];

      const getCityClass = (city) => {
        if (city.includes("Tokyo")) return "city-tokyo";
        if (city.includes("Kyoto")) return "city-kyoto";
        if (city.includes("Osaka")) return "city-osaka";
        return "";
      };

      const searchItems = [
        {
          title: "Visual Planner",
          href: "visual-schedule.html",
          description: "Day cards, Today Mode, transfers, daily plans, backups.",
          keywords: "planner today day itinerary transfer shinkansen flight backup schedule",
        },
        {
          title: "Bookings Status",
          href: "bookings-status.html",
          description: "Hotels, flights, trains, dining, attractions, booking actions.",
          keywords: "booking reservation hotel flight train smartex kichi shibuya sky confirmation nara haneda shinagawa",
        },
        {
          title: "Essential Apps",
          href: "essential-apps.html",
          description: "Family phone setup, app links, eSIM, Translate, offline maps.",
          keywords: "apps phone esim ubigi google maps translate navitime line chargespot wallet",
        },
        {
          title: "City Guide",
          href: "city-guide.html",
          description: "Tokyo, Kyoto, Osaka neighborhoods and city planning.",
          keywords: "city guide tokyo kyoto osaka nara neighborhood shopping shrine temple todai-ji nakatanidou",
        },
      ];

      const siteSearch = document.getElementById("siteSearch");
      const searchResults = document.getElementById("searchResults");
      const searchEmpty = document.getElementById("searchEmpty");

      function renderSearchResults(query = "") {
        const normalized = query.trim().toLowerCase();
        const matches = normalized
          ? searchItems.filter((item) =>
              `${item.title} ${item.description} ${item.keywords}`
                .toLowerCase()
                .includes(normalized),
            )
          : searchItems;
        searchResults.replaceChildren();

        matches.forEach((item) => {
          const link = document.createElement("a");
          const title = document.createElement("strong");
          const description = document.createElement("span");
          link.className = "search-result";
          link.href = item.href;
          title.textContent = item.title;
          description.textContent = item.description;
          link.appendChild(title);
          link.appendChild(description);
          searchResults.appendChild(link);
        });

        searchEmpty.classList.toggle("is-visible", matches.length === 0);
      }

      siteSearch.addEventListener("input", (event) => {
        renderSearchResults(event.target.value);
      });

      renderSearchResults();

      const grid = document.getElementById("daysGrid");
      grid.innerHTML = days
        .map(
          (day) => `
        <a href="visualizations/day-${String(day.day).padStart(2, "0")}.html" class="card">
          <div class="card-head">
            <div class="card-day-label">Day ${day.day}</div>
            <h2 class="card-title">${day.title}</h2>
            <p class="card-date">${day.date}</p>
          </div>
          <div class="card-body">
            <div class="card-location">
              <span class="city-chip ${getCityClass(day.startCity)}">${day.startCity}</span>
              <span class="arrow">→</span>
              <span class="city-chip ${getCityClass(day.endCity)}">${day.endCity}</span>
            </div>
            <p class="card-description">${day.description}</p>
            <span class="card-link">
              View Details
              <span class="arrow-icon">→</span>
            </span>
          </div>
        </a>
      `,
        )
        .join("");
    </script>
  </body>
</html>
